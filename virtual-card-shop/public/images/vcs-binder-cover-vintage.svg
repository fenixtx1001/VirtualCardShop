<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 920" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Vintage black vinyl trading card binder cover texture">
<defs>
  <linearGradient id="vinyl" x1="0" y1="0" x2="1" y2=".35">
    <stop offset="0" stop-color="#29322a"/>
    <stop offset=".12" stop-color="#151e18"/>
    <stop offset=".43" stop-color="#1a221b"/>
    <stop offset=".79" stop-color="#0c130f"/>
    <stop offset="1" stop-color="#1a221a"/>
  </linearGradient>
  <radialGradient id="sheen" cx=".23" cy=".12" r="1">
    <stop offset="0" stop-color="#b7baa0" stop-opacity=".15"/>
    <stop offset=".44" stop-color="#718072" stop-opacity=".035"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".21"/>
  </radialGradient>
  <pattern id="emboss" width="7" height="7" patternUnits="userSpaceOnUse">
    <path d="M0 2L7 0M0 6L7 4" stroke="#809081" stroke-opacity=".085" stroke-width=".65"/>
    <path d="M1 7L0 5M6 7L7 6" stroke="#000" stroke-opacity=".2" stroke-width="1"/>
  </pattern>
  <filter id="finegrain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="14" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
  </filter>
</defs>
<rect width="680" height="920" fill="url(#vinyl)"/>
<rect width="680" height="920" fill="url(#emboss)"/>
<rect width="680" height="920" fill="url(#sheen)"/>
<rect width="680" height="920" fill="#b6c2ab" filter="url(#finegrain)" opacity=".25"/>
<rect x="13" y="13" width="654" height="894" rx="8" fill="none" stroke="#050905" stroke-width="5"/>
<rect x="21" y="21" width="638" height="878" rx="5" fill="none" stroke="#5d665a" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="2 7"/>
<path d="M40 32v854M642 32v854" fill="none" stroke="#a2ad9d" stroke-opacity=".07" stroke-width="5"/>
<path d="M0 0L680 0V53C524 28 305 47 0 3z" fill="#a4b5a3" opacity=".033"/>
<path d="M0 920C95 866 457 904 680 875V920z" fill="#000" opacity=".16"/>
</svg>